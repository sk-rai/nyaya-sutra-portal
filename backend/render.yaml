databases:
  - name: nyaya-sutra-db
    plan: free
    databaseName: nyaya_sutra
    user: nyaya_app

services:
  - type: web
    name: nyaya-sutra-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn run:app --config gunicorn.conf.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nyaya-sutra-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://sk-rai.github.io
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.10.12"
    healthCheckPath: /api/health
