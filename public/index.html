<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyaya Sutra | Legal Case Management</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/tiers.css">
  <link rel="stylesheet" href="css/components.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    .user-menu {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }

    .user-tier-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .user-tier-badge.tier-unregistered {
      background: var(--gray-light);
      color: var(--gray-dark);
    }

    .user-tier-badge.tier-unpaid {
      background: #fff3cd;
      color: #856404;
    }

    .user-tier-badge.tier-paid {
      background: var(--success);
      color: var(--white);
    }

    .btn-logout {
      padding: 8px 16px;
      font-size: 0.9rem;
      background: transparent;
      border: 2px solid var(--white);
      color: var(--white);
    }

    .btn-logout:hover {
      background: var(--white);
      color: var(--navy-dark);
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <div class="logo">
          <svg width="40" height="40" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="18" fill="var(--navy-dark)" stroke="var(--gold-primary)" stroke-width="2" />
            <text x="20" y="25" font-family="Inter" font-size="14" fill="var(--gold-primary)"
              text-anchor="middle">⚖️</text>
          </svg>
          <span class="logo-text">Nyaya Sutra</span>
        </div>
        <nav class="nav">
          <div class="user-menu" id="userMenu">
            <!-- Will be populated by JavaScript -->
          </div>
        </nav>
      </div>
    </div>
  </header>

  <!-- Case Search Section -->
  <section class="case-search">
    <div class="container">
      <div class="search-box">
        <h2>Search Cases</h2>

        <div class="search-form">
          <input type="text" placeholder="Enter case number or party name..." class="search-input">
          <button class="btn btn-primary">Search</button>
        </div>

        <!-- Case Results (Dynamic) -->
        <div class="case-results" id="caseResults">
          <!-- Will be populated by JavaScript -->
        </div>
      </div>
    </div>
  </section>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tier-renderer.js"></script>
  <script src="js/print-control.js"></script>
  <script>
    // Check if user is logged in and redirect to dashboard
    document.addEventListener('DOMContentLoaded', () => {
      if (NyayaAPI.isLoggedIn()) {
        window.location.href = 'my-dashboard.html';
        return;
      }

      // For non-logged-in users, show the search page
      const userMenu = document.getElementById('userMenu');
      userMenu.innerHTML = `
        <button class="btn btn-outline" onclick="window.location.href='login.html'">Login / Register</button>
      `;
    });

    // Search handler
    document.querySelector('.search-form .btn').addEventListener('click', async () => {
      const input = document.querySelector('.search-input').value.trim();
      if (!input) {
        alert('Please enter a case number to search.');
        return;
      }

      if (!NyayaAPI.isLoggedIn()) {
        alert('Please login to search cases.');
        window.location.href = 'login.html';
        return;
      }

      const btn = document.querySelector('.search-form .btn');
      btn.disabled = true;
      btn.textContent = 'Searching...';

      try {
        const result = await NyayaAPI.searchCase('aft_del', input);
        const caseResults = document.getElementById('caseResults');

        if (result) {
          caseResults.innerHTML = `
            <div class="case-card" style="margin-top: 1.5rem; padding: 1.5rem; background: #f8f9fa; border-radius: 12px; border-left: 4px solid var(--gold-primary);">
              <div class="case-header" style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                <span class="case-number" style="font-weight: 700; color: var(--navy-dark);">${result.case_number}</span>
                <span style="color: green; font-weight: 600;">${result.freshness || 'fresh'}</span>
              </div>
              <div class="case-title" style="margin-bottom: 0.5rem;">${result.case_title || ''}</div>
              <div style="font-size: 0.9rem; color: #555;">
                <p><strong>Petitioner:</strong> ${result.petitioner || 'N/A'}</p>
                <p><strong>Respondent:</strong> ${result.respondent || 'N/A'}</p>
                <p><strong>Advocate:</strong> ${result.advocate_petitioner || 'N/A'}</p>
                <p><strong>Next Hearing:</strong> ${result.next_hearing_date || 'N/A'}</p>
                <p><strong>Court:</strong> ${result.court_code || 'N/A'}</p>
              </div>
            </div>
          `;
        } else {
          caseResults.innerHTML = '<p style="margin-top: 1rem; color: #666;">No case found with that number.</p>';
        }
      } catch (err) {
        document.getElementById('caseResults').innerHTML = `<p style="margin-top: 1rem; color: red;">Error: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Search';
      }
    });
  </script>
</body>

</html>
