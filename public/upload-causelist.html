<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Cause List | Nyaya Sutra</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .upload-container { padding: 2rem 0; min-height: 100vh; background: var(--gray-light); }
        .upload-box { background: var(--white); padding: 2.5rem; border-radius: 16px; max-width: 700px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .upload-title { font-size: 1.8rem; font-weight: 700; color: var(--navy-dark); margin-bottom: 0.5rem; }
        .upload-subtitle { color: var(--gray-medium); margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; font-weight: 600; color: var(--navy-dark); margin-bottom: 0.5rem; }
        .form-select, .form-input { width: 100%; padding: 0.875rem; border: 2px solid var(--gray-light); border-radius: 8px; font-size: 1rem; font-family: inherit; }
        .form-select:focus, .form-input:focus { outline: none; border-color: var(--navy-dark); }
        .file-drop { border: 3px dashed var(--gray-medium); border-radius: 12px; padding: 3rem; text-align: center; cursor: pointer; transition: all 0.3s ease; background: #fafafa; }
        .file-drop:hover, .file-drop.dragover { border-color: var(--navy-dark); background: #f0f4ff; }
        .file-drop-icon { font-size: 3rem; margin-bottom: 1rem; }
        .file-drop-text { color: var(--gray-medium); font-size: 1rem; }
        .file-drop-text strong { color: var(--navy-dark); }
        .file-name { margin-top: 1rem; padding: 0.75rem; background: #e8f5e9; border-radius: 8px; color: #2e7d32; font-weight: 600; display: none; }
        .btn-upload { width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem; }
        .result-box { margin-top: 2rem; padding: 1.5rem; border-radius: 12px; display: none; }
        .result-success { background: #e8f5e9; border: 2px solid #4caf50; }
        .result-error { background: #ffebee; border: 2px solid #f44336; }
        .result-duplicate { background: #fff3e0; border: 2px solid #ff9800; }
        .result-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.5rem; }
        .result-details { font-size: 0.95rem; line-height: 1.6; }
        .back-link { text-align: center; margin-top: 1.5rem; }
        .back-link a { color: var(--gray-medium); text-decoration: none; }
        .back-link a:hover { color: var(--navy-dark); }
    </style>
</head>
<body>
    <div class="upload-container">
        <div class="container">
            <div class="upload-box">
                <h1 class="upload-title">📄 Upload Cause List</h1>
                <p class="upload-subtitle">Upload a court cause list PDF to populate case data for searching and tracking.</p>

                <form id="uploadForm" onsubmit="handleUpload(event)">
                    <!-- Court Selection -->
                    <div class="form-group">
                        <label class="form-label">Select Court</label>
                        <select class="form-select" id="courtCode" required>
                            <option value="">-- Select Court --</option>
                            <optgroup label="Armed Forces Tribunal">
                                <option value="aft_del">AFT Delhi (Principal Bench)</option>
                                <option value="aft_mum">AFT Mumbai</option>
                                <option value="aft_che">AFT Chennai</option>
                                <option value="aft_kol">AFT Kolkata</option>
                                <option value="aft_lko">AFT Lucknow</option>
                                <option value="aft_chd">AFT Chandigarh</option>
                            </optgroup>
                            <optgroup label="Central Administrative Tribunal">
                                <option value="cat_del">CAT Delhi (Principal Bench)</option>
                                <option value="cat_mum">CAT Mumbai</option>
                                <option value="cat_che">CAT Chennai</option>
                                <option value="cat_kol">CAT Kolkata</option>
                            </optgroup>
                            <optgroup label="High Courts">
                                <option value="hc_del">Delhi High Court</option>
                                <option value="hc_bom">Bombay High Court</option>
                            </optgroup>
                        </select>
                    </div>

                    <!-- Hearing Date -->
                    <div class="form-group">
                        <label class="form-label">Hearing Date (from cause list)</label>
                        <input type="date" class="form-input" id="hearingDate">
                    </div>

                    <!-- File Upload -->
                    <div class="form-group">
                        <label class="form-label">Cause List PDF</label>
                        <div class="file-drop" id="fileDrop" onclick="document.getElementById('fileInput').click()">
                            <div class="file-drop-icon">📁</div>
                            <div class="file-drop-text">
                                <strong>Click to select</strong> or drag & drop PDF file here
                            </div>
                        </div>
                        <input type="file" id="fileInput" accept=".pdf" style="display: none;" onchange="handleFileSelect(event)">
                        <div class="file-name" id="fileName"></div>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary btn-upload" id="uploadBtn" disabled>
                        Upload & Parse Cause List
                    </button>
                </form>

                <!-- Result -->
                <div class="result-box" id="resultBox">
                    <div class="result-title" id="resultTitle"></div>
                    <div class="result-details" id="resultDetails"></div>
                </div>

                <div class="back-link">
                    <a href="my-dashboard.html">← Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let selectedFile = null;

        // Redirect if not logged in
        document.addEventListener('DOMContentLoaded', () => {
            if (!NyayaAPI.isLoggedIn()) {
                window.location.href = 'login.html';
            }
        });

        // Drag and drop handling
        const fileDrop = document.getElementById('fileDrop');
        fileDrop.addEventListener('dragover', (e) => { e.preventDefault(); fileDrop.classList.add('dragover'); });
        fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('dragover'));
        fileDrop.addEventListener('drop', (e) => {
            e.preventDefault();
            fileDrop.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].name.toLowerCase().endsWith('.pdf')) {
                selectedFile = files[0];
                showFileName(files[0].name);
            } else {
                alert('Please drop a PDF file.');
            }
        });

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                showFileName(file.name);
            }
        }

        function showFileName(name) {
            const el = document.getElementById('fileName');
            el.textContent = `✅ Selected: ${name} (${(selectedFile.size / 1024).toFixed(1)} KB)`;
            el.style.display = 'block';
            document.getElementById('uploadBtn').disabled = false;
        }

        async function handleUpload(event) {
            event.preventDefault();

            if (!selectedFile) {
                alert('Please select a PDF file.');
                return;
            }

            const courtCode = document.getElementById('courtCode').value;
            if (!courtCode) {
                alert('Please select a court.');
                return;
            }

            const hearingDate = document.getElementById('hearingDate').value;
            const btn = document.getElementById('uploadBtn');
            const resultBox = document.getElementById('resultBox');

            btn.disabled = true;
            btn.textContent = '⏳ Uploading & Parsing...';
            resultBox.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('file', selectedFile);
                formData.append('court_code', courtCode);
                if (hearingDate) formData.append('hearing_date', hearingDate);

                const token = NyayaAPI.getToken();
                const response = await fetch(`${NyayaAPI.BASE_URL}/api/admin/upload-causelist`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData,
                });

                const data = await response.json();

                if (data.success) {
                    const d = data.data;
                    if (d.status === 'duplicate') {
                        showResult('duplicate', '⚠️ Already Processed',
                            `This file was already uploaded previously.<br>Cases in database: ${d.cases_found}`);
                    } else {
                        showResult('success', '✅ Upload Successful!',
                            `<strong>${d.cases_found}</strong> cases found in PDF<br>` +
                            `<strong>${d.cases_new}</strong> new cases added<br>` +
                            `<strong>${d.cases_updated}</strong> existing cases updated<br>` +
                            `${d.errors > 0 ? `<strong>${d.errors}</strong> errors` : 'No errors'}<br><br>` +
                            `Court: ${d.court_code} | File: ${d.filename}`);
                    }
                } else {
                    showResult('error', '❌ Upload Failed', data.error ? data.error.message : 'Unknown error');
                }
            } catch (err) {
                showResult('error', '❌ Error', err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Upload & Parse Cause List';
            }
        }

        function showResult(type, title, details) {
            const box = document.getElementById('resultBox');
            box.className = `result-box result-${type}`;
            box.style.display = 'block';
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultDetails').innerHTML = details;
            box.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
